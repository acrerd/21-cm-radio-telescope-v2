; PlatformIO configuration for SRT Drive Controller
; Target: Arduino Due

[env:due]
platform = atmelsam
board = due
framework = arduino

; Serial monitor settings
monitor_speed = 9600

; Libraries
lib_deps =
    sebnil/DueFlashStorage@^1.0.0

; Build flags
build_flags =
    -D ARDUINO_SAM_DUE
    -Wall
