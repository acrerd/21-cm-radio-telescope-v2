; PlatformIO configuration for SRT Drive Controller
; Target: Arduino Due

[platformio]
default_envs = due

[env:due]
platform = atmelsam
board = due
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Libraries
lib_deps =
    sebnil/DueFlashStorage@^1.0.0

; Build flags
build_flags =
    -D ARDUINO_SAM_DUE
    -Wall

; =============================================================================
; Simulation environment - no real hardware required
; Switch to this env in PlatformIO toolbar or: pio run -e simulation
; =============================================================================
[env:simulation]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 115200
lib_deps =
    sebnil/DueFlashStorage@^1.0.0
build_flags =
    -D ARDUINO_SAM_DUE
    -D SIMULATION_MODE
    -Wall
