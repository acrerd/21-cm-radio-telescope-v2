; PlatformIO Project Configuration for SRT Controller
; Supports both ESP32-S3 (USB) and WT32-ETH01 (Ethernet)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 460800

; USB CDC settings for ESP32-S3
build_flags =
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Upload settings
upload_speed = 460800
upload_protocol = esptool
board_build.flash_mode = dio
board_build.f_flash = 80000000L

lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

; =============================================================================
; WT32-ETH01 - ESP32 with native Ethernet (LAN8720 PHY)
; Program via external USB-TTL adapter connected to TX0/RX0 pins
; Use manual buttons: hold IO0 low, press EN, release IO0, then upload
; =============================================================================
[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200

; No USB CDC - uses standard UART
build_flags =
    -DBOARD_WT32_ETH01
    -DCORE_DEBUG_LEVEL=0

; Upload settings - external USB-TTL adapter
; Change upload_port to match your adapter's COM port
upload_speed = 460800
upload_protocol = esptool

lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

; =============================================================================
; Native build for running unit tests on PC (not on ESP32)
; Run with: pio test -e native
; Coverage: pio test -e native-coverage, then run coverage.bat
; =============================================================================
[env:native]
platform = native
build_flags = -DNATIVE_BUILD
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<web_server.cpp> -<wifi_manager.cpp> -<srt_serial.cpp> -<stellarium.cpp> -<settings.cpp> -<state.cpp>
test_framework = unity

[env:native-coverage]
platform = native
build_flags =
    -DNATIVE_BUILD
    --coverage
    -lgcov
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<web_server.cpp> -<wifi_manager.cpp> -<srt_serial.cpp> -<stellarium.cpp> -<settings.cpp> -<state.cpp>
test_framework = unity
