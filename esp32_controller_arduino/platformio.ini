; PlatformIO Project Configuration for SRT Controller
; The deployed board is the WT32-ETH01 (Ethernet); it is the default build.
; The ESP32-S3 environment is kept for legacy/bench use only.

[platformio]
default_envs = wt32-eth01

; Exact versions of the platform, the framework and the two web libraries, so
; that one source builds one firmware. Unpinned, a cleared .pio or a PlatformIO
; update rebuilt different library code with nothing in the repository showing
; it - and the scheduler's Update firmware, which skips a flash when the
; source hash (source_hash.py, which covers this file) is unchanged, could not
; have seen it either. Pinned 2026-10-02 to what was then built and running.
; To update one: change it here, build, test, flash.
[common]
platform = espressif32 @ 7.0.1
platform_packages =
    platformio/framework-arduinoespressif32 @ 3.20017.241212
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git#ef448a8a1dffe4ec1b72326dd5a26211ff227b49
    https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f

[env:esp32s3]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 460800

; USB CDC settings for ESP32-S3
build_flags =
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Upload settings
upload_speed = 460800
upload_protocol = esptool
board_build.flash_mode = dio
board_build.f_flash = 80000000L

lib_deps = ${common.lib_deps}

; =============================================================================
; WT32-ETH01 - ESP32 with native Ethernet (LAN8720 PHY)
; First flash/recovery via temporary FT232 programmer on TX0/RX0 pins
; Use manual buttons: start upload, hold IO0 low, press EN, release IO0
; =============================================================================
[env:wt32-eth01]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = wt32-eth01
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_wt32_ota.csv

; No USB CDC - uses standard UART
build_flags =
    -DBOARD_WT32_ETH01
    -DCORE_DEBUG_LEVEL=0
    ; diag.cpp records a panic's backtrace in RTC memory before the real handler runs
    -Wl,--wrap=esp_panic_handler
; recompile diag.cpp every build, so its build date is this build's
extra_scripts = pre:stamp_build.py

; Upload settings - temporary FT232 programmer
; Change upload_port to match your adapter's COM port
upload_speed = 460800
upload_protocol = esptool

lib_deps = ${common.lib_deps}

; Ethernet OTA upload. Use after the WT32 has been flashed once with the
; wt32-eth01 serial environment above.
[env:wt32-eth01-ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = 192.168.50.120
upload_flags =
    --auth=srt-ota-1420
    --port=3232

; =============================================================================
; Host-side unit tests. Runs the pure computation - coordinate transforms and
; the drive/true pointing transform - with no board attached:
;
;     pio test -e native
;
; Only those two translation units are built (build_src_filter); the rest of
; src/ is Arduino-framework code with no host equivalent. test/shim/ supplies
; the little of Arduino.h and Preferences.h that pointing.cpp touches, so the
; firmware source is compiled here exactly as it is flashed, rather than being
; copied into the test and allowed to drift from it.
; =============================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<coordinates.cpp> +<pointing.cpp> +<../test/shim/shim.cpp>
build_flags =
    -std=gnu++17
    -I src
    -I test/shim
    ; Unity leaves double assertions out unless asked; the pointing transform is
    ; computed in double and checked to a thousandth of a degree.
    -DUNITY_INCLUDE_DOUBLE
